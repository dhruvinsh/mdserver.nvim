# release-please keeps a release PR open from the conventional commits on main
# (feat → minor, fix → patch, feat!/BREAKING CHANGE → major). Merging it tags
# vX.Y.Z, updates CHANGELOG.md and publishes the GitHub release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
