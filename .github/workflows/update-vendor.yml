# Keeps the browser libraries pinned in vendor.json up to date. Renovate could
# bump the versions but not the sha256 checksums, so this runs the repository's
# own script, installs and tests the result, then opens (or refreshes) one PR.
name: Update vendored libraries

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to update, e.g. "marked mermaid@12.2.0". Empty: all to their latest version.'
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Update vendor.json
        env:
          PACKAGES: ${{ inputs.packages }}
          MDSERVER_UPDATE_SUMMARY: ${{ runner.temp }}/changes.md
        # PACKAGES is split into arguments on purpose
        run: nvim --clean -l scripts/update-vendor.lua $PACKAGES

      - name: Install and test the new versions
        run: |
          nvim --clean -l build.lua
          nvim --clean -l scripts/smoke.lua

      - name: Pull request body
        env:
          CHANGES: ${{ runner.temp }}/changes.md
        run: |
          {
            echo "Updates the browser libraries pinned in \`vendor.json\`:"
            echo
            cat "$CHANGES"
            echo
            echo "The new files were downloaded, their checksums recorded and the smoke test passed."
            echo "Major versions can change their API: open a few documents (code blocks, mermaid) before merging."
          } > "$RUNNER_TEMP/body.md"

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: deps/vendor
          delete-branch: true
          add-paths: vendor.json
          commit-message: "fix(deps): update vendored browser libraries"
          title: "fix(deps): update vendored browser libraries"
          body-path: ${{ runner.temp }}/body.md
          labels: dependencies
